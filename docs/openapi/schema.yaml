openapi: 3.0.3
info:
  title: Archi — Products API
  version: 1.0.0
  description: 'CRUD de productos sobre Django REST Framework, con arquitectura limpia:
    entidad de dominio pura, casos de uso y repositorio detrás de un puerto.'
paths:
  /api/v1/products/:
    get:
      operationId: v1_products_list
      description: Returns every product. No pagination or filtering yet.
      summary: List products
      tags:
      - Products
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductOutput'
          description: ''
    post:
      operationId: v1_products_create
      description: The id is generated by the domain, not by the client or the database,
        so it is not part of the request body.
      summary: Create a product
      tags:
      - Products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductInputRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductOutput'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NegativePrice:
                  value:
                    error:
                      status: 400
                      type: InvalidPrice
                      detail: Price cannot be negative.
                  summary: Negative price
          description: Malformed payload, or a business rule was violated.
  /api/v1/products/{product_id}/:
    get:
      operationId: v1_products_retrieve
      summary: Get a product by id
      parameters:
      - in: path
        name: product_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Products
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductOutput'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UnknownProduct:
                  value:
                    error:
                      status: 404
                      type: ProductNotFound
                      detail: Product 3f1c9d2e-8b7a-4c5d-9e6f-0a1b2c3d4e5f not found.
                  summary: Unknown product
          description: No product exists with that id.
    put:
      operationId: v1_products_update
      description: 'Full replacement: every writable field must be sent.'
      summary: Update a product
      parameters:
      - in: path
        name: product_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductInputRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductOutput'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NegativePrice:
                  value:
                    error:
                      status: 400
                      type: InvalidPrice
                      detail: Price cannot be negative.
                  summary: Negative price
          description: Malformed payload, or a business rule was violated.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UnknownProduct:
                  value:
                    error:
                      status: 404
                      type: ProductNotFound
                      detail: Product 3f1c9d2e-8b7a-4c5d-9e6f-0a1b2c3d4e5f not found.
                  summary: Unknown product
          description: No product exists with that id.
    delete:
      operationId: v1_products_destroy
      summary: Delete a product
      parameters:
      - in: path
        name: product_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Products
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '204':
          description: Deleted.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UnknownProduct:
                  value:
                    error:
                      status: 404
                      type: ProductNotFound
                      detail: Product 3f1c9d2e-8b7a-4c5d-9e6f-0a1b2c3d4e5f not found.
                  summary: Unknown product
          description: No product exists with that id.
components:
  schemas:
    ErrorDetail:
      type: object
      properties:
        status:
          type: integer
        type:
          type: string
          description: Exception class name, e.g. InvalidPrice.
        detail:
          type: string
      required:
      - detail
      - status
      - type
    ErrorResponse:
      type: object
      description: The envelope every error response uses. See config/exception_handler.py.
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
    ProductInputRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          default: ''
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - name
      - price
    ProductOutput:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - description
      - id
      - name
      - price
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
